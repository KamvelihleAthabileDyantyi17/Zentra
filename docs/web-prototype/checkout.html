<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Shanon's Food Truck</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">S</span>Shanon's Food Truck</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="order-status.html">Order status</a></li>
          <li><a href="feedback.html">Feedback</a></li>
        </ul>
      </nav>
      <a class="btn btn-outline nav-cta btn-sm" href="cart.html">Back to cart</a>
    </div>
  </header>

  <main class="container section" style="max-width:560px;">
    <h1 style="font-size:1.7rem;">Checkout</h1>

    <div class="card card-pad" style="margin-bottom:20px;">
      <h3 style="margin-bottom:14px;">Order summary</h3>
      <div id="checkout-order-summary"></div>
    </div>

    <form id="checkout-form" class="card card-pad">

      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="e.g. Amandla Sekeleni" required />
      </div>

      <div class="field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" placeholder="e.g. 082 123 4567" required />
      </div>

      <div class="field">
        <label>Delivery / pickup</label>
        <div class="choice-row">
          <label class="choice-card">
            <input type="radio" name="fulfilment" value="pickup" checked />
            🚶 Pickup at truck
          </label>
          <label class="choice-card">
            <input type="radio" name="fulfilment" value="delivery" />
            🛵 Delivery
          </label>
        </div>
      </div>

      <div class="field">
        <label for="address">Delivery address / pickup note</label>
        <textarea id="address" name="address" rows="2" placeholder="e.g. Corner of Main Rd, Parklands — or leave blank for pickup"></textarea>
      </div>

      <div class="field">
        <label>Payment method</label>
        <div class="choice-row">
          <label class="choice-card">
            <input type="radio" name="payment" value="card" checked />
            💳 Card
          </label>
          <label class="choice-card">
            <input type="radio" name="payment" value="cash" />
            💵 Cash on collection
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Confirm order</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p style="margin:0;">Shanon's Food Truck · Parklands · Online ordering prototype</p>
    </div>
  </footer>

  <nav class="tabbar" aria-label="Primary">
    <a href="index.html"><span class="tab-icon">🏠</span>Home</a>
    <a href="menu.html"><span class="tab-icon">🍽️</span>Menu</a>
    <a href="cart.html"><span class="tab-icon">🛒</span>Cart</a>
    <a href="order-status.html"><span class="tab-icon">📍</span>Status</a>
    <a href="feedback.html"><span class="tab-icon">⭐</span>Feedback</a>
  </nav>

  <script src="assets/js/script.js"></script>
</body>
</html>

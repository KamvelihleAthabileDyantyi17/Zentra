name: Android CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shannos-food-truck-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Signed release build: runs only when the keystore secrets have been added to the repo
      # (Settings → Secrets and variables → Actions). See docs/play-store/README.md.
      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SHANNOS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret; skipping signed release build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shannos-release.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK and App Bundle
        if: steps.keystore.outputs.present == 'true'
        env:
          SHANNOS_KEYSTORE_PATH: ${{ runner.temp }}/shannos-release.jks
          SHANNOS_KEYSTORE_PASSWORD: ${{ secrets.SHANNOS_KEYSTORE_PASSWORD }}
          SHANNOS_KEY_ALIAS: ${{ secrets.SHANNOS_KEY_ALIAS }}
          SHANNOS_KEY_PASSWORD: ${{ secrets.SHANNOS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload signed release
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shannos-food-truck-release-signed
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check website scripts for syntax errors
        run: for f in web/js/*.js; do node --input-type=module --check < "$f" && echo "ok $f"; done

      - name: Install test browser
        working-directory: tests/web
        run: npm install && npx playwright install --with-deps chromium

      - name: End-to-end test (customer + staff in demo mode)
        working-directory: tests/web
        env:
          SHOTS_DIR: ${{ github.workspace }}/web-test-screenshots
        run: |
          # The test runs on demo data, whatever the live setting in config.js is.
          sed -i 's/export const USE_FIREBASE = true;/export const USE_FIREBASE = false;/' ../../web/js/config.js
          (cd ../../web && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          npm test

      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-test-screenshots
          path: web-test-screenshots
